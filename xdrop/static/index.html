<!doctype html>
<!-- Single-page browser interface for the local xdrop dashboard. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f6f4">
  <title>xdrop · Share privately</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#overview" aria-label="xdrop home">
        <span class="brand-mark"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M8 7h16v5H8zM8 14h10v5H8zM8 21h16v5H8z"/><circle cx="23" cy="16.5" r="3"/></svg></span>
        <span class="brand-name">xdrop<span class="brand-period">.</span></span>
      </a>
      <div class="side-label">WORKSPACE</div>
      <nav class="nav" aria-label="Main navigation">
        <button class="nav-item active" data-view="overview"><span class="nav-icon">⌂</span>Overview</button>
        <button class="nav-item" data-view="devices"><span class="nav-icon">◉</span>Devices<span class="nav-count" id="peer-count">0</span></button>
        <button class="nav-item" data-view="transfers"><span class="nav-icon">⇄</span>Transfers</button>
      </nav>
      <div class="sidebar-bottom">
        <button class="nav-item" data-view="settings"><span class="nav-icon">⚙</span>Settings</button>
        <div class="profile"><div class="avatar" id="avatar">S</div><div class="profile-copy"><strong id="profile-name">This device</strong><span>Private network</span></div><span class="online-dot"></span></div>
      </div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <div class="crumb"><span>Workspace</span><span class="crumb-slash">/</span><strong id="page-name">Overview</strong></div>
        <div class="top-actions"><span class="connection"><i></i><span id="connection-label">Connecting</span></span><button class="icon-button" id="refresh" aria-label="Refresh">↻</button></div>
      </header>
      <div class="content" id="view"></div>
      <footer class="footer"><span>Encrypted peer-to-peer sharing</span><span>xdrop <b id="version">1.0.5</b></span></footer>
    </main>
  </div>
  <div class="toast" id="toast" role="status"></div>
</body>
</html>
