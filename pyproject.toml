# Build, package, runtime dependency, and command metadata for xdrop.
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xdrop"
version = "1.0.5"
description = "Encrypted peer-to-peer file transfer for your LAN, with a terminal and local web interface."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Sanket Valunj" },
]
maintainers = [
  { name = "Sanket Valunj" },
]
keywords = ["lan", "p2p", "file-transfer", "zeroconf", "mdns", "cli", "encryption"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Communications :: File Sharing",
  "Topic :: Security :: Cryptography",
  "Topic :: System :: Networking",
]
dependencies = [
  "zeroconf>=0.131",
  "cryptography>=41",
  "rich>=13",
  "tqdm>=4.65",
  "qrcode>=7.4",
]

[project.urls]
Homepage = "https://pypi.org/project/xdrop/"

[project.scripts]
xdrop = "xdrop.cli:main"
xdrop-web = "xdrop.web:main"

[tool.setuptools.packages.find]
include = ["xdrop*"]

[tool.setuptools.package-data]
xdrop = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning",
]
